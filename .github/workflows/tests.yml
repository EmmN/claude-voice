name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y -qq jq
      - run: pip install -q numpy
      - run: for f in bin/* install.sh mac/register-autostart.sh; do head -1 "$f" | grep -q python || bash -n "$f"; done
      - run: tests/run
